<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLACE - Scanner GTIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0D0D11] text-white min-h-screen flex flex-col items-center justify-between p-4 md:p-6 font-sans">

    <div class="w-full max-w-md flex justify-start">
        <a href="/" class="text-gray-400 hover:text-white border border-gray-600 px-4 py-2 rounded-lg text-sm flex items-center transition">
            <i class="fas fa-arrow-left mr-2"></i> Voltar
        </a>
    </div>

    <div class="flex flex-col items-center w-full max-w-sm my-auto">
        <div class="text-center mb-4">
            <h1 class="text-xl md:text-2xl font-bold mb-1">Escaneie o GTIN</h1>
            <p class="text-gray-400 text-xs md:text-sm">Enquadre o código de barras na área demarcada</p>
        </div>

        <div class="w-full h-64 sm:h-72 border-4 border-pink-500 rounded-xl bg-black flex items-center justify-center relative overflow-hidden shadow-[0_0_15px_rgba(236,72,153,0.4)]">
            <div id="reader" class="w-full h-full"></div>
        </div>

        <div class="bg-gray-800/80 p-3 rounded-lg w-full mt-4 border border-gray-700">
            <div class="flex space-x-2">
                <input type="text" id="mockGtin" placeholder="Digite o GTIN..." class="w-full p-2 bg-gray-900 border border-gray-700 rounded text-white text-center text-xs md:text-sm focus:outline-none focus:border-indigo-500">
                <button onclick="processarScan(document.getElementById('mockGtin').value)" class="bg-indigo-600 px-4 py-2 rounded font-bold text-xs md:text-sm hover:bg-indigo-500 transition">Ok</button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-md h-6"></div> <div id="actionModal" class="fixed inset-0 bg-black bg-opacity-90 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white text-black p-6 md:p-8 rounded-xl w-full max-w-md shadow-2xl relative max-h-[90vh] overflow-y-auto" id="modalContent">
            </div>
    </div>

    <script>
        let gtinAtual = "";
        let idAtual = null;
        let html5QrCode;

        window.onload = () => {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 220, height: 130 }, aspectRatio: 1.0 };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText) => {
                    html5QrCode.pause();
                    processarScan(decodedText);
                },
                (errorMessage) => {}
            ).catch((err) => {
                html5QrCode.start({ facingMode: "user" }, config, (decodedText) => {
                    html5QrCode.pause();
                    processarScan(decodedText);
                }).catch(e => console.error("Erro na câmera:", e));
            });
        };

        async function processarScan(gtin) {
            if(!gtin) return;
            gtinAtual = gtin.trim();

            // Busca no backend
            const res = await fetch(`/api/gtin/${gtinAtual}`);
            const data = await res.json();
            
            const modal = document.getElementById('actionModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');

            if (data.existe) {
                // Ingrediente já cadastrado
                idAtual = data.id;
                content.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold mb-1 text-indigo-600">Produto Reconhecido</h3>
                    <p class="text-gray-500 mb-4 text-xs font-bold">GTIN: ${gtinAtual} - ${data.nome} (${data.conteudo_por_embalagem}${data.un_medida})</p>
                    
                    <input type="hidden" id="hdnNome" value="${data.nome}">
                    <input type="hidden" id="hdnUn" value="${data.un_medida}">
                    <input type="hidden" id="hdnConteudo" value="${data.conteudo_por_embalagem}">

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">CAIXAS/EMBALAGENS COMPRADAS</label>
                            <input type="number" step="0.01" id="inpQtdEmbalagens" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-indigo-500 text-sm" placeholder="Ex: 5" autofocus>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">PREÇO PAGO POR EMBALAGEM (R$)</label>
                            <input type="number" step="0.01" id="inpPrecoEmbalagem" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-indigo-500 text-sm" placeholder="Ex: 15.50">
                        </div>
                    </div>
                    <div class="mt-6 flex flex-col sm:flex-row gap-2">
                        <button onclick="escanearOutro()" class="w-full sm:w-1/2 bg-gray-200 text-gray-800 py-3 rounded-lg font-bold text-xs md:text-sm hover:bg-gray-300 transition">Escanear Outro</button>
                        <button onclick="salvarGtin()" class="w-full sm:w-1/2 bg-black text-white py-3 rounded-lg font-bold text-xs md:text-sm hover:bg-gray-800 transition">Salvar Compra</button>
                    </div>
                `;
            } else {
                // Produto Novo (Não cadastrado)
                idAtual = null;
                content.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold mb-1 text-pink-600">Novo Produto Detectado</h3>
                    <p class="text-gray-500 mb-4 text-xs font-bold">GTIN: ${gtinAtual}</p>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">NOME DO INGREDIENTE</label>
                            <input type="text" id="inpNome" placeholder="Ex: Creme de Leite" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-pink-500 text-sm">
                        </div>
                        
                        <div class="flex space-x-3">
                            <div class="w-3/5">
                                <label class="block text-xs font-bold text-gray-500 mb-1">CONTEÚDO (PESO/VOL)</label>
                                <input type="number" step="0.01" id="inpConteudo" placeholder="Ex: 200" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-pink-500 text-sm">
                            </div>
                            <div class="w-2/5">
                                <label class="block text-xs font-bold text-gray-500 mb-1">UN. MEDIDA</label>
                                <select id="inpUn" class="w-full border border-gray-300 p-3 rounded-lg bg-white focus:outline-pink-500 text-sm">
                                    <option value="g">g</option>
                                    <option value="ml">ml</option>
                                    <option value="un">un</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex space-x-3">
                            <div class="w-1/2">
                                <label class="block text-xs font-bold text-gray-500 mb-1">QTD. CAIXAS</label>
                                <input type="number" step="0.01" id="inpQtdEmbalagens" placeholder="Ex: 5" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-pink-500 text-sm">
                            </div>
                            <div class="w-1/2">
                                <label class="block text-xs font-bold text-gray-500 mb-1">PREÇO CAIXA (R$)</label>
                                <input type="number" step="0.01" id="inpPrecoEmbalagem" placeholder="Ex: 3.50" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-pink-500 text-sm">
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex flex-col sm:flex-row gap-2">
                        <button onclick="escanearOutro()" class="w-full sm:w-1/2 bg-gray-200 text-gray-800 py-3 rounded-lg font-bold text-xs md:text-sm hover:bg-gray-300 transition">Escanear Outro</button>
                        <button onclick="salvarGtin()" class="w-full sm:w-1/2 bg-black text-white py-3 rounded-lg font-bold text-xs md:text-sm hover:bg-gray-800 transition">Salvar Compra</button>
                    </div>
                `;
            }
        }

        function escanearOutro() {
            document.getElementById('actionModal').classList.add('hidden');
            document.getElementById('mockGtin').value = "";
            
            if (html5QrCode) {
                try {
                    html5QrCode.resume().catch(() => {
                        console.log("Reiniciando leitura da câmera...");
                    });
                } catch (e) {
                    console.error("Erro ao reiniciar scanner:", e);
                }
            }
        }

        async function salvarGtin() {
            // Monta o pacote de dados para enviar ao Python
            const payload = {
                gtin: gtinAtual,
                ingrediente_id: idAtual || "", // Se for nulo, envia vazio
                qtd_embalagens: document.getElementById('inpQtdEmbalagens').value,
                preco_por_embalagem: document.getElementById('inpPrecoEmbalagem').value
            };
            
            if (idAtual) {
                // Pega os dados ocultos do produto existente
                payload.nome = document.getElementById('hdnNome').value;
                payload.un_medida = document.getElementById('hdnUn').value;
                payload.conteudo_por_embalagem = document.getElementById('hdnConteudo').value;
            } else {
                // Pega os dados digitados do produto novo
                payload.nome = document.getElementById('inpNome').value;
                payload.un_medida = document.getElementById('inpUn').value;
                payload.conteudo_por_embalagem = document.getElementById('inpConteudo').value;
            }

            // Envia para o NOVO motor matemático de entrada de estoque
            const response = await fetch('/api/ingredientes/entrada', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                if (html5QrCode) {
                    html5QrCode.stop().then(() => {
                        window.location.href = '/';
                    }).catch(() => {
                        window.location.href = '/';
                    });
                } else {
                    window.location.href = '/';
                }
            } else {
                const err = await response.json();
                alert('Erro ao salvar o ingrediente: ' + (err.erro || 'Desconhecido'));
            }
        }
    </script>
</body>
</html>
